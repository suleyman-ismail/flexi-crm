var TRL = { 'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t',
  'у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sht','ъ':'a','ь':'y','ю':'yu','я':'ya','ѝ':'i','ç':'c','ş':'s','ğ':'g','ı':'i','ö':'o','ü':'u' };
function lat(x){
  var t = String(x || '').toLowerCase(), o = '';
  for (var i = 0; i < t.length; i++) { var ch = t.charAt(i); o += TRL.hasOwnProperty(ch) ? TRL[ch] : ch; }
  try { o = o.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } catch (e) {}
  return o.replace(/sht/g, 'st').replace(/zh/g, 'z').replace(/ch|ts|tz/g, 'c').replace(/sh/g, 's').replace(/kh/g, 'h').replace(/j/g, 'y')
    .replace(/w/g, 'v').replace(/x/g, 'ks').replace(/q/g, 'k').replace(/y([aeiou])/g, '$1').replace(/i([aou])/g, '$1').replace(/y/g, 'i')
    .replace(/[^a-z0-9]+/g, ' ').trim();
}
function srchBox(){
  return '<div class="srch"><input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="🔎 Търси клиент: име, град, телефон…" value="' + esc(Q) + '" oninput="Q=this.value;onQ()"></div>';
}
function cmpC(x, y){
  var cx = D.closed.indexOf(x.s) > -1, cy = D.closed.indexOf(y.s) > -1;
  if (cx !== cy) return cx ? 1 : -1;
  var nx = x.nx && x.nx !== '-' ? x.nx : '9999', ny = y.nx && y.nx !== '-' ? y.nx : '9999';
  if (!x.nx !== !y.nx) return x.nx ? 1 : -1;
  return nx < ny ? -1 : nx > ny ? 1 : x.n.localeCompare(y.n);
}
// Търси сред ВСИЧКИ клиенти (не само „Мои“)
function findC(q){
  var toks = lat(q).split(' ').filter(Boolean), qd = q.replace(/[^0-9]/g, ''), digits = /^[0-9\s+()\/-]+$/.test(q.trim());
  var out = [];
  D.clients.forEach(function(c){
    var sc = 0;
    if (digits) {
      var pd = String(c.p || '').replace(/[^0-9]/g, '');
      if (qd.length >= 3 && (pd.indexOf(qd) > -1 || intl(c.p).indexOf(intl(qd)) > -1)) sc = 2;
    } else if (toks.length) {
      var n = lat(c.n), hay = n + ' ' + lat(c.c) + ' ' + lat(c.m), hayC = hay.replace(/[aeiou]/g, '');
      var exact = toks.every(function(t){ return hay.indexOf(t) > -1; });
      // резерва: само съгласни („yildiz“ = „Йълдъз“, „dimitar“ = „Димитър“)
      var loose = !exact && toks.every(function(t){ var k = t.replace(/[aeiou]/g, ''); return hay.indexOf(t) > -1 || (k.length >= 3 && hayC.indexOf(k) > -1); });
      if (exact) sc = (' ' + n).indexOf(' ' + toks[0]) > -1 ? 4 : n.indexOf(toks[0]) > -1 ? 3 : 2;
      else if (loose) sc = 1;
    }
    if (sc) out.push({ c: c, sc: sc });
  });
  out.sort(function(a, b){ return b.sc - a.sc || cmpC(a.c, b.c); });
  return out.map(function(x){ return x.c; });
}

    var c = cs && cs[0]; if (!c) return;
    if (!c.icon || !c.icon.length) { toast('Този контакт няма снимка', 3500); return; }
    avShrink(c.icon[0], avSave);
  }, function(){ toast('Няма достъп до контактите', 3500); });
}
function avSave(d){
  var t = AVT; if (!t) return;
  AV[avK(t.k, t.n)] = d; avRefresh(); closeSheet(); toast('🖼️ Снимката е запазена');
  bg('avSet', [t.k, t.n, d], function(r){ if (r && r.m) { AV = r.m; AVH = r.h || ''; idbSet('av', { h: AVH, m: AV }); avRefresh(); } }, 'снимка');
}
function avDel(){
  var t = AVT; if (!t || !confirm('Да махна ли снимката?')) return;
  delete AV[avK(t.k, t.n)]; avRefresh(); closeSheet();
  bg('avSet', [t.k, t.n, ''], function(r){ if (r && r.m) { AV = r.m; AVH = r.h || ''; idbSet('av', { h: AVH, m: AV }); avRefresh(); } }, 'снимка');
}
// снимки в списъците на работници и партньори + в профилите им
var _listW0 = listW;
listW = function(){ _listW0(); avRows('#wl .tr[data-w]', 'w', 'data-w'); };
var _listP0 = listP;
listP = function(){
  _listP0(); avRows('#pl .tr[data-p]', 'p', 'data-p');
  if (isAdm() && KD) Array.prototype.forEach.call(document.querySelectorAll('#pl .tr[data-p]'), function(r){
    var s = kSumOf(r.getAttribute('data-p')); if (s && s.due > 0) r.querySelector('.ar').insertAdjacentHTML('beforebegin', '<span class="due">🤝 ' + eur(s.due) + '</span>');
  });
};
function avRows(sel, kind, at){
  Array.prototype.forEach.call(document.querySelectorAll(sel), function(r){ r.insertAdjacentHTML('afterbegin', avHtml(kind, r.getAttribute(at), 'md')); r.classList.add('avr'); });
}
function avHead(kind, n, sub){
  return '<div class="avh">' + '<button type="button" class="avb" data-k="' + kind + '" data-n="' + esc(n) + '" onclick="avEdit(this.dataset.k,this.dataset.n)" title="Смени снимката">' + avHtml(kind, n, 'lg') + '<i>📷</i></button>' +
    '<span><b>' + esc(n) + '</b>' + (sub ? '<small>' + sub + '</small>' : '') + '</span></div>';
}
var _openW0 = openW;
openW = function(n){
  _openW0(n); var w = (D.workers || []).filter(function(x){ return x.n === n; })[0]; if (!w) return;
  var b = el('shB').firstElementChild; if (b) b.insertAdjacentHTML('afterbegin', avHead('w', n, esc(splitL(w.sp).slice(0, 2).join(', ') || wJobs(w).slice(0, 2).join(', ') || '')));
};
var _openP0 = openP;
openP = function(n){
  var p = pBy(n);
  if (!p && !(isAdm() && kSumOf(n))) return;
  if (p) _openP0(n); else openSheet('🤝 ' + n, '<div style="padding:12px 16px 30px"><div class="s">Партньорът не е в списъка „🏭 Партньори“ (изтрит или преименуван).</div></div>');
  var b = el('shB').firstElementChild;
  if (b) b.insertAdjacentHTML('afterbegin', avHead('p', n, p ? esc([p.t, p.city].filter(Boolean).join(' · ')) : ''));
  if (isAdm() && b) { b.insertAdjacentHTML('beforeend', '<div id="kprof" data-n="' + esc(n) + '">' + kProfHtml(n) + '</div>'); if (!KD) kLoad(); }
};
// снимка в картата на клиента (горе)
var _drawCard1 = drawCard;
drawCard = function(){
  _drawCard1();
  var t = document.querySelector('#cdB .box.hero .t'); if (!t || !CUR) return;
  t.insertAdjacentHTML('afterbegin', '<button type="button" class="avb sm" data-n="' + esc(CUR.name) + '" onclick="avEdit(\'c\',this.dataset.n)" title="Снимка на клиента">' + avHtml('c', CUR.name, 'hd') + '</button>');
};

// ---- 🤝 комисиони (вижда само Сюлейман) ----
var KD = null;
if (typeof idbGet === 'function') idbGet('kd', function(v){ if (v && !KD) KD = v; });
function kLoad(){
  if (!TOKEN || !isAdm()) return;
  apiCall('kGet', []).then(kGot, function(){});
}
function kGot(r){
  if (!r || !r.items) return; KD = r; idbSet('kd', r);
  if (CUR && el('card').style.display === 'block') drawCard();
  var kp = el('kprof'); if (kp) kp.innerHTML = kProfHtml(kp.getAttribute('data-n') || kpN);
  if (el('kall')) kAllDraw();
  if (TAB === 'w' && el('pl')) listP();
}
function kWs(){ return WS === 'r' ? 'r' : 'm'; }
function kFor(client, jid){ if (!KD) return []; var c = String(client).toLowerCase(); return KD.items.filter(function(x){ return x.ws === kWs() && x.client.toLowerCase() === c && x.jid === jid; }); }
function kSumOf(n){ if (!KD) return null; var k = String(n || '').toLowerCase(); return KD.sum.filter(function(x){ return x.n.toLowerCase() === k; })[0] || null; }
function kAv(client, jid){
  if (!isAdm()) return '';
  var a = kFor(client, jid); if (!a.length) return '';
  return a.slice(0, 3).map(function(x){ return avHtml('p', x.p, 'xs'); }).join('') + (a.length > 3 ? '<span class="av xs more">+' + (a.length - 3) + '</span>' : '');
}
function kRow(x, showJob){
  var paid = x.st === 'paid';
  return '<div class="krow' + (paid ? ' paid' : '') + '">' + avHtml('p', x.p, 'md') +
    (showJob ? '<span class="kx" data-n="' + esc(x.client) + '" data-w="' + esc(x.ws) + '" onclick="kGoC(this.dataset.n,this.dataset.w)">' : '<span class="kx" data-p="' + esc(x.p) + '" onclick="openP(this.dataset.p)">') + '<b>' + esc(showJob ? x.client + (x.job ? ' – ' + x.job : '') : x.p) + '</b><small>' +
    (paid ? '✅ Платено ' + fmt(x.paid) : '⏳ Дължимо') + (x.note ? ' · ' + esc(x.note) : '') + (showJob ? '' : ' · ' + fmt(x.date)) + '</small></span>' +
    '<b class="ka">' + eur(x.amt) + '</b>' +
    (paid ? '<button data-id="' + esc(x.id) + '" onclick="kUnpay(this.dataset.id)" title="Не е платена">↩️</button>'
          : '<button class="ok" data-id="' + esc(x.id) + '" onclick="kPayAsk([this.dataset.id])" title="Платено">💶</button><button data-id="' + esc(x.id) + '" onclick="kForm(this.dataset.id)" title="Промени">✏️</button><button data-id="' + esc(x.id) + '" onclick="kDel(this.dataset.id)" title="Изтрий">🗑️</button>') + '</div>';
}
function kGoC(n, ws){ if (ws !== kWs()) { toast('Клиентът е в „' + (ws === 'r' ? 'Ремонти' : 'Flexi Home') + '“ – смени раздела горе', 4000); return; } closeSheet(); openC(n); }
function kSec(client, jid){
  if (!isAdm()) return '';
  var a = kFor(client, jid), due = a.filter(function(x){ return x.st !== 'paid'; }).reduce(function(t, x){ return t + x.amt; }, 0);
  var h = '<div class="ch">🤝 Партньори и комисиони <span class="kown">👁️ само ти</span></div>';
  if (!KD) h += '<div class="s">⏳ Зареждане…</div>';
  else if (a.length) h += '<div class="klist">' + a.map(function(x){ return kRow(x, false); }).join('') + '</div>' + (due ? '<div class="s">Дължимо по тази работа: <b>' + eur(due) + '</b></div>' : '');
  else h += '<div class="s">Няма партньори към тази работа. Добави партньор и комисионата му – тя се трупа в профила му, докато я платиш.</div>';
  return h + '<div class="acts"><button class="ok" data-j="' + esc(jid) + '" onclick="kForm(\'\',this.dataset.j)">➕ Партньор с комисиона</button></div>';
}
function kForm(id, jid){
  var x = id && KD ? KD.items.filter(function(i){ return i.id === id; })[0] : null;
  jid = x ? x.jid : jid; var d = jDeal(jid);
  var names = ((D && D.partners) || []).map(function(p){ return p.n; });
  var h = '<form id="frm" onsubmit="return kSend(event)"><input type="hidden" name="id" value="' + esc(x ? x.id : '') + '"><input type="hidden" name="jid" value="' + esc(jid || '') + '">' +
    '<div class="s" style="margin-bottom:6px">📝 ' + esc(CUR ? CUR.name : '') + (d ? ' – ' + esc(d.desc) : '') + '</div>';
  h += fld('Партньор *', '<input name="partner" list="kpl" required autocomplete="off" placeholder="избери или напиши ново име" value="' + esc(x ? x.p : '') + '"><datalist id="kpl">' + names.map(function(n){ return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>');
  h += half(fld('Комисиона (€) *', '<input name="amount" inputmode="decimal" required placeholder="напр. 500" value="' + (x ? x.amt : '') + '">'), fld('Дата', '<input name="date" type="date" value="' + esc(x ? x.date : D.today) + '">'));
  h += fld('Бележка', '<input name="note" autocomplete="off" placeholder="напр. плащане в края на месеца" value="' + esc(x ? x.note : '') + '">');
  h += '<div class="s" style="margin-top:8px">👁️ Вижда само Сюлейман. Нов партньор се добавя сам в „🏭 Партньори“ (скрит за останалите). При „💶 Платено“ комисионата се записва като разход към тази работа.</div>';
  h += '<button class="save" id="sv">💾 Запази</button></form>';
  openSheet(x ? '✏️ Комисиона – ' + x.p : '🤝 Партньор към работата', h);
}
function kSend(e){
  e.preventDefault();
  var d = formData(); d.ws = kWs(); d.client = CUR.name; var j = jDeal(d.jid); d.job = j ? j.desc : '';
  d.amount = String(d.amount || '').replace(/\s/g, '').replace(',', '.');
  if (!(Number(d.amount) > 0)) { toast('⚠️ Въведи сума'); return false; }
  closeSheet(); toast('⏳ Записва се…', 1500);
  bg('kSave', [d], function(r){ kGot(r); toast('🤝 Записано'); if (!pBy(d.partner)) load(); }, 'комисиона');
  return false;
}
function kDel(id){ if (!confirm('🗑️ Да изтрия ли тази комисиона?')) return; bg('kDel', [id], kGot, 'изтриване'); }
function kUnpay(id){ if (!confirm('↩️ Комисионата не е платена?\n\nРазходът към работата ще бъде махнат.')) return; bg('kUnpay', [id], function(r){ kGot(r); toast('↩️ Отново дължимо'); load(); }, 'връщане'); }
function kPayAsk(ids){
  var a = KD.items.filter(function(x){ return ids.indexOf(x.id) > -1 && x.st !== 'paid'; }); if (!a.length) return;
  var s = a.reduce(function(t, x){ return t + x.amt; }, 0), who = a.map(function(x){ return x.p; }).filter(function(v, i, z){ return z.indexOf(v) === i; }).join(', ');
  var h = '<form id="frm" onsubmit="return kPaySend(event)"><input type="hidden" name="ids" value="' + esc(ids.join(',')) + '">' +
    '<div class="kpay"><b>' + eur(s) + '</b><small>' + esc(who) + ' · ' + a.length + (a.length === 1 ? ' комисиона' : ' комисиони') + '</small></div>' +
    fld('Дата на плащане', '<input name="date" type="date" value="' + esc(D.today) + '">') +
    '<div class="s" style="margin-top:8px">Всяка комисиона се записва като разход „Комисионна/брокер“ към своята работа – печалбата се смята вярно.</div>' +
    '<button class="save" id="sv">💶 Платено</button></form>';
  openSheet('💶 Плащане на комисиона', h);
}
function kPaySend(e){
  e.preventDefault(); var d = formData(), ids = String(d.ids || '').split(',').filter(Boolean);
  closeSheet(); toast('⏳ Записва се…', 2000);
  bg('kPay', [ids, d.date], function(r){ kGot(r); toast('💶 Платено и записано като разход'); load(); }, 'плащане');
  return false;
}
var kpN = '';
function kProfHtml(n){
  kpN = n; var s = kSumOf(n), a = KD ? KD.items.filter(function(x){ return x.p.toLowerCase() === String(n).toLowerCase(); }) : [];
  var due = a.filter(function(x){ return x.st !== 'paid'; }), paid = a.filter(function(x){ return x.st === 'paid'; }).sort(function(x, y){ return y.paid.localeCompare(x.paid); });
  var h = '<div class="ch">🤝 Комисиони <span class="kown">👁️ само ти</span></div>';
  if (!KD) return h + '<div class="s">⏳ Зареждане…</div>';
  h += '<div class="cg"><div class="' + (s && s.due ? 'ow' : '') + '"><small>Дължимо</small><b>' + eur(s ? s.due : 0) + '</b></div><div><small>Платено</small><b style="color:#15803d">' + eur(s ? s.paid : 0) + '</b></div><div><small>Работи</small><b>' + a.length + '</b></div></div>';
  if (due.length) h += '<div class="jsub">⏳ Дължимо</div><div class="klist">' + due.map(function(x){ return kRow(x, true); }).join('') + '</div>' +
    (due.length > 1 ? '<div class="acts"><button class="ok" data-ids="' + esc(due.map(function(x){ return x.id; }).join(',')) + '" onclick="kPayAsk(this.dataset.ids.split(\',\'))">💶 Плати всички (' + eur(s.due) + ')</button></div>' : '');
  if (paid.length) h += '<div class="jsub">✅ Платено</div><div class="klist">' + paid.map(function(x){ return kRow(x, true); }).join('') + '</div>';
  if (!a.length) h += '<div class="s">Още няма комисиони. Добавят се от картата на клиента → работата → 🤝 Партньори.</div>';
  return h;
}
// 👤 → 🤝 Комисиони: кой колко чака (за края на месеца)
function kAll(){ openSheet('🤝 Комисиони на партньорите', '<div id="kall" style="padding:12px 16px 30px"></div>'); kAllDraw(); kLoad(); }
function kAllDraw(){
  var b = el('kall'); if (!b) return;
  if (!KD) { b.innerHTML = '<div class="s">⏳ Зареждане…</div>'; return; }
  var due = KD.sum.filter(function(x){ return x.due > 0; }), tot = due.reduce(function(t, x){ return t + x.due; }, 0);
  var h = '<div class="cg"><div class="' + (tot ? 'ow' : '') + '"><small>Общо дължимо</small><b>' + eur(tot) + '</b></div><div><small>Партньори</small><b>' + due.length + '</b></div></div>';
  h += KD.sum.length ? '<div class="klist">' + KD.sum.map(function(x){
    return '<div class="krow' + (x.due ? '' : ' paid') + '" data-p="' + esc(x.n) + '" onclick="openP(this.dataset.p)">' + avHtml('p', x.n, 'md') + '<span class="kx"><b>' + esc(x.n) + '</b><small>' + x.cnt + (x.cnt === 1 ? ' работа' : ' работи') + ' · платено ' + eur(x.paid) + '</small></span><b class="ka' + (x.due ? ' due' : '') + '">' + (x.due ? eur(x.due) : '✓') + '</b><span class="ar">›</span></div>';
  }).join('') + '</div>' : '<div class="s">Още няма комисиони. Добавят се от картата на клиента → работата → 🤝 Партньори.</div>';
  b.innerHTML = h + '<div class="s" style="margin-top:10px">👁️ Вижда само Сюлейман.</div>';
}
if ('serviceWorker' in navigator) {
  var swHad = !!navigator.serviceWorker.controller, swDone = false;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function(r){
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) r.update().catch(function(){}); });
    setInterval(function(){ r.update().catch(function(){}); }, 1800000);
  }).catch(function(){});
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (!swHad) { swHad = true; return; }
    if (swDone) return; swDone = true;
    if (el('sheet').style.display === 'block') { toast('🔄 Има нова версия – зарежда се при следващото отваряне', 5000); return; }
    toast('🔄 Нова версия…', 3000); setTimeout(function(){ location.reload(); }, 400);
  });
}
try { wsUI({ wsr: ls('crm_wsr') === '1' }); } catch (e) {}
boot();
</script></body></html>
