.tb .acts{margin-top:6px}

.load{text-align:center;color:#64748b;padding:30px}
</style></head><body>
<div class="hd"><header><div><h1><img src="icon-192.png" alt="">CRM Flexi Home</h1><div class="d" id="dt"></div></div><div class="hr"><button class="me" id="meB" onclick="meMenu()">👤</button><button onclick="load(true)" title="Обнови">⟳</button></div></header>
<div id="sync"></div><nav class="tabs"><button id="tb_t" onclick="tab('t')">📋 Задачи</button><button id="tb_c" onclick="tab('c')">👥 Клиенти</button><button id="tb_r" onclick="tab('r')">📊 Отчет</button></nav></div>
<div class="seg" id="seg"><button id="sg_m" onclick="seg('m')">👤 Мои</button><button id="sg_a" onclick="seg('a')">👥 Всички</button></div>
<div id="off">📴 Няма интернет – показани са последните данни</div><div id="main"><div class="load">Зареждане…</div></div>
<div id="card" class="sheet"><div class="top"><button onclick="closeCard()">←</button><b id="cdT"></b></div><div id="cdB"></div></div>
<div id="sheet" class="sheet"><div class="top"><b id="shT"></b><button onclick="closeSheet()">✕</button></div><div id="shB"></div></div>
<div id="pv"><button class="c" onclick="closePv()">✕</button><div class="l" id="pvL">Зареждане…</div><img id="pvI" alt=""></div>
<div id="login"><div class="logo"><img src="icon-192.png" alt=""></div><h1>CRM Flexi Home</h1><p>Въведи своя PIN</p>
<div class="dots" id="dots"><span></span><span></span><span></span><span></span><span></span><span></span></div>
<div class="pad"><button onclick="pinK(1)">1</button><button onclick="pinK(2)">2</button><button onclick="pinK(3)">3</button><button onclick="pinK(4)">4</button><button onclick="pinK(5)">5</button><button onclick="pinK(6)">6</button><button onclick="pinK(7)">7</button><button onclick="pinK(8)">8</button><button onclick="pinK(9)">9</button><span></span><button onclick="pinK(0)">0</button><button class="x" onclick="pinB()">⌫</button></div><div id="lerr"></div></div>
<div id="toast"></div>
<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbwsUVFw9bRxnsx_NDtJfZDOlU8iE6Br91SEhCP7z4Jn-Y223ytToFbdM00Rb2DXMLn55w/exec';
function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
var TOKEN = ls('crm_token') || '';
function apiCall(fn, args, extra){
  var body = { fn: fn, args: args || [], token: TOKEN };
  if (extra) for (var k in extra) body[k] = extra[k];
  return fetch(API_URL, { method: 'POST', body: JSON.stringify(body) })
    .catch(function(){ throw new Error('Няма връзка с интернет'); })
    .then(function(r){ if (!r.ok) throw new Error('Сървърът не отговаря (' + r.status + ')'); return r.json(); })
    .then(function(j){
      if (!j.ok) { if (j.error === 'AUTH') { logout(); throw new Error('Влез отново с PIN'); } throw new Error(j.error); }
      return j.data;
    });
}
// Съвместимост със стария код: google.script.run.withSuccessHandler(...).withFailureHandler(...).fn(...)
function mkRun(ok, fail){
  return new Proxy({}, { get: function(t, k){
    if (k === 'withSuccessHandler') return function(f){ return mkRun(f, fail); };
    if (k === 'withFailureHandler') return function(f){ return mkRun(ok, f); };
    return function(){ var a = Array.prototype.slice.call(arguments); syncOn(1);
      apiCall(k, a).then(function(r){ syncOn(-1); if (ok) ok(r); }, function(e){ syncOn(-1); if (fail) fail(e); else toast('Грешка: ' + e.message, 4500); }); };
  }});
}
var google = { script: { get run(){ return mkRun(null, null); } } };
var SYNC = 0;
function syncOn(n){ SYNC = Math.max(0, SYNC + n); var e = el('sync'); if (e) e.className = SYNC ? 'on' : ''; }
var D = null, CUR = null, TAB = 't', SEG = 'm', Q = '', ASKED = true, OPEN = {};
try { OPEN = JSON.parse(localStorage.getItem('crm_open') || '{}') || {}; } catch (e) {}
var MON = ['яну','фев','мар','апр','май','юни','юли','авг','сеп','окт','ное','дек'];
var STC = {'Ново запитване':['#dbeafe','#1d4ed8'],'Проведена среща':['#ede9fe','#6d28d9'],'Изпратена оферта':['#fef3c7','#b45309'],'Преговори':['#ffedd5','#c2410c'],'Сключен договор':['#dcfce7','#15803d'],'Загубен':['#f3f4f6','#6b7280']};
try { TAB = localStorage.getItem('crm_tab') || 't'; SEG = localStorage.getItem('crm_seg') || 'm'; } catch (e) {}
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function opts(a, sel){ return a.map(function(x){ return '<option' + (x === sel ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join(''); }
function toast(t, ms){ var e = el('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function(){ e.style.display = 'none'; }, ms || 2500); }
function fmt(d){ if (!d) return '—'; var p = d.split('-'); return parseInt(p[2], 10) + ' ' + MON[parseInt(p[1], 10) - 1]; }
function rel(d){ if (d < D.today) return 'over'; if (d === D.today) return 'today'; return ''; }
function whenTxt(d, t){ var r = rel(d); return (r === 'over' ? 'Просрочено · ' : r === 'today' ? 'Днес · ' : '') + fmt(d) + (t ? ' · ' + t : ''); }
function addD(n){ var p = D.today.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)).toISOString().slice(0, 10); }
function eur(n){ return '€' + Math.round(Number(n) || 0).toLocaleString('en-US'); }
function pill(s){ var c = STC[s] || ['#e2e8f0','#334155']; return s ? '<span class="pill" style="background:' + c[0] + ';color:' + c[1] + '">' + esc(s) + '</span>' : ''; }
function busy(on){ el('main').style.opacity = on ? .45 : 1; el('main').style.pointerEvents = on ? 'none' : 'auto'; }
function err(e){ busy(false); toast('Грешка: ' + (e && e.message ? e.message : e), 4500); }
function localToday(){ var n = new Date(); return n.getFullYear() + '-' + ('0' + (n.getMonth() + 1)).slice(-2) + '-' + ('0' + n.getDate()).slice(-2); }
function load(manual){
  if (!TOKEN) return;
  google.script.run.withSuccessHandler(function(d){ el('off').style.display = 'none'; ls('crm_data', JSON.stringify(d)); render(d); if (manual) toast('Обновено'); })
    .withFailureHandler(function(e){ busy(false); if (/интернет/.test(e.message) && D) el('off').style.display = 'block'; else toast('Грешка: ' + e.message, 4500); }).getAppData();
}
function boot(){
  if (!TOKEN) { showLogin(); return; }
  var c = ls('crm_data');
  if (c) { try { var d = JSON.parse(c); d.today = localToday(); render(d); } catch (e) {} }
  load();
}
function intl(p){ var d = String(p || '').replace(/[^0-9]/g, ''); if (d.indexOf('00') === 0) d = d.slice(2); else if (d.indexOf('0') === 0) d = '359' + d.slice(1); return d; }
function tel(p){ if (!p) return ''; var d = intl(p); if (d.length < 6) return ''; return '<a href="tel:+' + d + '">📞 Звънни</a><a href="viber://chat?number=%2B' + d + '">💜 Viber</a><a href="whatsapp://send?phone=' + d + '">🟢 WhatsApp</a>'; }
function mapB(u){ return u ? '<a href="' + esc(u) + '" target="_blank">📍 Карта</a>' : ''; }
function nm(n){ return '<span class="lnk" data-n="' + esc(n) + '" onclick="openC(this.dataset.n)">' + esc(n) + '</span>'; }
function mine(r){ return SEG === 'a' || !D.me || !r || r === D.me; }
function sec(t, n, body, emptyTxt){ return '<h2>' + t + '<span>' + n + '</span></h2>' + (n ? body : '<div class="empty">' + emptyTxt + '</div>'); }
function taskBy(row){ return D.tasks.filter(function(t){ return t.row === row; })[0]; }

function render(d){

  return D.clients.filter(function(c){ return c.s === OFFER && ('l' in c) && mine(c.r) && daysSince(c.l || c.i) > STALE; })
    .sort(function(a, b){ return daysSince(b.l || b.i) - daysSince(a.l || a.i); });

// ---------- 🔎 Търсачка (име, град, телефон, модел – и на латиница) ----------
var TRL = { 'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t',
  'у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sht','ъ':'a','ь':'y','ю':'yu','я':'ya','ѝ':'i','ç':'c','ş':'s','ğ':'g','ı':'i','ö':'o','ü':'u' };
function lat(x){
  var t = String(x || '').toLowerCase(), o = '';
  for (var i = 0; i < t.length; i++) { var ch = t.charAt(i); o += TRL.hasOwnProperty(ch) ? TRL[ch] : ch; }
  try { o = o.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } catch (e) {}
  return o.replace(/sht/g, 'st').replace(/zh/g, 'z').replace(/ch|ts|tz/g, 'c').replace(/sh/g, 's').replace(/kh/g, 'h').replace(/j/g, 'y')
    .replace(/w/g, 'v').replace(/x/g, 'ks').replace(/q/g, 'k').replace(/y([aeiou])/g, '$1').replace(/i([aou])/g, '$1').replace(/y/g, 'i')
    .replace(/[^a-z0-9]+/g, ' ').trim();
}
function srchBox(){
  return '<div class="srch"><input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="🔎 Търси клиент: име, град, телефон…" value="' + esc(Q) + '" oninput="Q=this.value;onQ()"></div>';
}
function cmpC(x, y){
  var cx = D.closed.indexOf(x.s) > -1, cy = D.closed.indexOf(y.s) > -1;
  if (cx !== cy) return cx ? 1 : -1;
  var nx = x.nx && x.nx !== '-' ? x.nx : '9999', ny = y.nx && y.nx !== '-' ? y.nx : '9999';
  if (!x.nx !== !y.nx) return x.nx ? 1 : -1;
  return nx < ny ? -1 : nx > ny ? 1 : x.n.localeCompare(y.n);
}
// Търси сред ВСИЧКИ клиенти (не само „Мои“)
function findC(q){
  var toks = lat(q).split(' ').filter(Boolean), qd = q.replace(/[^0-9]/g, ''), digits = /^[0-9\s+()\/-]+$/.test(q.trim());
  var out = [];
  D.clients.forEach(function(c){
    var sc = 0;
    if (digits) {
      var pd = String(c.p || '').replace(/[^0-9]/g, '');
      if (qd.length >= 3 && (pd.indexOf(qd) > -1 || intl(c.p).indexOf(intl(qd)) > -1)) sc = 2;
    } else if (toks.length) {
      var n = lat(c.n), hay = n + ' ' + lat(c.c) + ' ' + lat(c.m), hayC = hay.replace(/[aeiou]/g, '');
      var exact = toks.every(function(t){ return hay.indexOf(t) > -1; });
      // резерва: само съгласни („yildiz“ = „Йълдъз“, „dimitar“ = „Димитър“)
      var loose = !exact && toks.every(function(t){ var k = t.replace(/[aeiou]/g, ''); return hay.indexOf(t) > -1 || (k.length >= 3 && hayC.indexOf(k) > -1); });
      if (exact) sc = (' ' + n).indexOf(' ' + toks[0]) > -1 ? 4 : n.indexOf(toks[0]) > -1 ? 3 : 2;
      else if (loose) sc = 1;
    }
    if (sc) out.push({ c: c, sc: sc });
  });
  out.sort(function(a, b){ return b.sc - a.sc || cmpC(a.c, b.c); });
  return out.map(function(x){ return x.c; });
}
function clientRow(c){
  var col = (STC[c.s] || ['#e2e8f0', '#94a3b8'])[1];
  return '<div class="lr" data-n="' + esc(c.n) + '" onclick="openC(this.dataset.n)" title="' + esc(c.s || '') + '"><span class="dt" style="background:' + col + '"></span>' +
    '<span class="nm">' + esc(c.n) + '</span><span class="ar">›</span></div>';
}
function rows(a){ return '<div class="lst">' + a.map(clientRow).join('') + '</div>'; }
function results(q){
  var a = findC(q), MAXR = 50;
  return '<h2>🔎 Резултати<span>' + a.length + '</span></h2>' + (a.length ? rows(a.slice(0, MAXR)) +
    (a.length > MAXR ? '<div class="empty">… още ' + (a.length - MAXR) + ' – уточни търсенето</div>' : '')
    : '<div class="empty">Няма клиент с „' + esc(q) + '“.</div><div class="qnew"><button data-n="' + esc(q) + '" onclick="openForm(this.dataset.n)">➕ Нов клиент „' + esc(q) + '“</button></div>');
}

// ---------- 📊 Отчет ----------
function drawReport(){
  var cs = D.clients.filter(function(c){ return mine(c.r); }), ts = D.tasks.filter(function(x){ return mine(x.rep); });
  var open = cs.filter(function(c){ return c.s && D.closed.indexOf(c.s) < 0; }), won = cs.filter(function(c){ return c.s === 'Сключен договор'; });
  var sum = function(a){ return a.reduce(function(s, c){ return s + c.b; }, 0); };
  var mon = D.today.slice(0, 7), neu = cs.filter(function(c){ return c.i && c.i.slice(0, 7) === mon; });
  var k = function(l, v, col){ return '<div class="kpi"><div class="l">' + l + '</div><div class="v" style="color:' + col + '">' + v + '</div></div>'; };
  var h = '<div class="kpis">' + k('💼 Активни оферти', eur(sum(open)), '#1e3a5f') + k('🏆 Спечелени', eur(sum(won)), '#15803d') +
    k('🔔 Задачи днес', ts.filter(function(x){ return x.date === D.today; }).length, '#c2410c') + k('⚠️ Просрочени', ts.filter(function(x){ return x.date < D.today; }).length, '#b91c1c') +
    k('🆕 Нови този месец', neu.length, '#1d4ed8') + k('🕳️ Без задача', noTask().length, '#b45309') + '</div>';
  var st = D.stages.slice(); cs.forEach(function(c){ if (c.s && st.indexOf(c.s) < 0) st.push(c.s); });
  var rows = st.map(function(s){ var a = cs.filter(function(c){ return c.s === s; }); return { s: s, n: a.length, b: sum(a) }; });
  var mx = Math.max.apply(null, rows.map(function(r){ return r.n; }).concat([1]));
  h += '<h2>📊 Клиенти по етап<span>' + cs.length + '</span></h2>' + rows.map(function(r){
    return '<div class="bar"><div class="r"><span>' + pill(r.s) + '</span><span><b>' + r.n + '</b> · ' + eur(r.b) + '</span></div><div class="b" style="width:' + Math.round(r.n / mx * 100) + '%"></div></div>';
  }).join('');
  el('main').innerHTML = h;
}

function send(e){
  e.preventDefault();
  var d = formData(), sv = el('sv'); sv.disabled = true; sv.textContent = 'Записване…';
  google.script.run.withSuccessHandler(function(m){
      if (m && m.dup) {
        sv.disabled = false; sv.textContent = '💾 Запази';
        if (confirm('⚠️ Този телефон вече е записан на: ' + m.dup + '. Да добавя ли нов клиент въпреки това?')) {
          d.confirmDup = true; sv.disabled = true; sv.textContent = 'Записване…';
          google.script.run.withSuccessHandler(function(x){ afterSave(x, d); }).withFailureHandler(err).saveTask(d);
        }
        return;
      }
      afterSave(m, d); })
    .withFailureHandler(function(er){ sv.disabled = false; sv.textContent = '💾 Запази'; err(er); }).saveTask(d);
  return false;
}

  h += fld('Етап на клиента', '<select name="stage" onchange="if(this.value===&quot;Загубен&quot;){el(&quot;noNx&quot;).checked=true;nxT();}"><option value="">— без промяна' + (x.stage ? ' (' + esc(x.stage) + ')' : '') + ' —</option>' + opts(D.stages) + '</select>');
  h += '<div class="nx"><h3>➡️ Следваща стъпка</h3><label class="chk"><input type="checkbox" id="noNx" onchange="nxT()"> Няма следваща стъпка</label><div id="nxB">' +
    fld('Какво', '<select name="ntype">' + opts(D.types, 'Телефонно обаждане') + '</select>') +
    '<div class="qd"><button type="button" onclick="qd(1)">Утре</button><button type="button" onclick="qd(3)">След 3 дни</button><button type="button" onclick="qd(7)">След седмица</button></div>' +
    half(fld('Дата', '<input type="date" id="nDate" name="ndate" value="' + addD(1) + '">'), fld('Час', '<input type="time" name="ntime" value="10:00">')) +
    fld('🔔 Текст за календара', '<input name="nremind" id="nRem" class="remind" maxlength="80" placeholder="напр. Обади се за офертата">') + '</div></div>';
  h += '<button class="save" id="sv">💾 Запази</button></form>';
  openSheet('✅ ' + x.type + ' – ' + x.client, h);
}
function qd(n){ el('nDate').value = addD(n); }
function nxT(){ el('nxB').style.display = el('noNx').checked ? 'none' : 'block'; }
function sendDone(e){
  e.preventDefault();
  var d = formData(), x = DONE, nx = !el('noNx').checked;
  if (nx && (!d.ndate || !d.nremind)) { toast('Попълни дата и 🔔 текст за следващата стъпка (или отметни „Няма следваща стъпка“)', 4000); return false; }
  var p = { note: d.note, stage: d.stage, next: nx ? { type: d.ntype, date: d.ndate, time: d.ntime, remind: d.nremind } : null };
  closeSheet(); D.tasks = D.tasks.filter(function(t){ return t.row !== x.row; }); render(D); toast('✅ Записано');
  google.script.run.withSuccessHandler(function(r){
    ls('crm_data', JSON.stringify(r)); render(r); toast(nx ? '✅ Готово · следващата стъпка е в календара' : '✅ Готово!');
    if (CUR && el('card').style.display === 'block' && CUR.name === x.client) openC(x.client);
  }).withFailureHandler(function(er){ err(er); load(); }).completeTask(x.row, x.client, p);
  return false;
}

// ---------- 👤 Карта на клиента ----------
function openC(n){
  el('cdT').textContent = n; el('cdB').innerHTML = '<div class="load">Зареждане…</div>'; el('card').style.display = 'block'; el('card').scrollTop = 0;
  google.script.run.withSuccessHandler(function(c){ CUR = c; drawCard(); }).withFailureHandler(function(e){ closeCard(); err(e); }).getClient(n);
}
function closeCard(){ el('card').style.display = 'none'; CUR = null; }
function secT(d){ OPEN[d.getAttribute('data-k')] = d.open; try { localStorage.setItem('crm_open', JSON.stringify(OPEN)); } catch (e) {} }
function fold(k, title, sum, inner){
  return '<details class="sec" data-k="' + k + '" ontoggle="secT(this)"' + (OPEN[k] ? ' open' : '') + '><summary>' + title +
    '<span class="sm">' + (sum || '') + '</span></summary><div class="in">' + inner + '</div></details>';
}
function drawCard(){
  var c = CUR, h = '', NL = String.fromCharCode(10);
  el('cdT').textContent = c.name;
  var pl = c.tasks.filter(function(t){ return t.status === 'Планирана'; }).sort(function(a, b){ return (a.date + a.time).localeCompare(b.date + b.time); });
  var nx = pl[0];
  // Винаги видимо: етап, следваща задача и бързи бутони
  h += '<div class="box hero"><div class="t">' + esc(c.name) + ' ' + pill(c.stage) + '</div>' +
    '<div class="s">' + [esc(c.city), c.budget ? eur(c.budget) : '', c.rep ? '👤 ' + esc(c.rep) : ''].filter(Boolean).join(' · ') + '</div>' +
    (nx ? '<div class="nxt">📅 ' + fmt(nx.date) + (nx.time ? ' · ' + esc(nx.time) : '') + ' – ' + esc(nx.type) + (nx.remind ? ': ' + esc(nx.remind) : '') + '</div>'
        : '<div class="nxt no">⚠️ Няма планирана задача</div>') + staleLine(c) +
    '<div class="acts">' + tel(c.phone) + mapB(c.maps) + '</div>' +
    '<div class="acts"><button class="ok" data-n="' + esc(c.name) + '" onclick="openForm(this.dataset.n)">➕ Задача</button>' +
    '<label>📸 Снимка<input type="file" accept="image/*" multiple style="display:none" onchange="upC(this)"></label>' +
    '<label>📎 Файл<input type="file" multiple style="display:none" onchange="upF(this)"></label></div></div>';
  // 👤 Информация
  var info = [['📞', c.phone], ['📍', c.city], ['🏠', c.model], ['💶', c.budget ? eur(c.budget) : ''], ['🔎', c.src ? 'Източник: ' + c.src : ''],
    ['👤', c.rep], ['🗓️', c.inq ? 'Запитване: ' + fmt(c.inq) : ''], ['☎️', c.last ? 'Последен контакт: ' + fmt(c.last) : '']]
    .filter(function(r){ return r[1]; }).map(function(r){ return '<div>' + r[0] + ' ' + esc(r[1]) + '</div>'; }).join('');
  h += fold('info', '👤 Информация', esc(c.phone || c.city),
    '<div class="info">' + (info || '<div>—</div>') + '</div><div class="acts"><button onclick="editC()">✏️ Редактирай</button><button onclick="locC()">📌 Запази локация</button></div>');
  // 🏷️ Етап
  h += fold('stage', '🏷️ Етап', pill(c.stage), '<div class="chips">' + D.stages.map(function(s){
    return '<button class="' + (s === c.stage ? 'on' : '') + '" data-s="' + esc(s) + '" onclick="stageC(this.dataset.s)">' + esc(s) + '</button>'; }).join('') + '</div>');
  // 🕑 История
  var hist = c.tasks.length ? c.tasks.map(function(t){
    var p = t.status === 'Планирана', ic = p ? '🔵' : t.status === 'Изпълнена' ? '✅' : '✖️';
    return '<div class="hist ' + (p ? 'pl' : 'dn') + '"><div class="when">' + ic + ' ' + fmt(t.date) + (t.time ? ' · ' + esc(t.time) : '') + ' · ' + esc(t.status) + '</div>' +
      '<div class="t">' + esc(t.type) + (t.rep ? ' <span class="s">👤 ' + esc(t.rep) + '</span>' : '') + '</div>' +
      (t.remind ? '<div class="s" style="color:#92400e">🔔 ' + esc(t.remind) + '</div>' : '') + (t.desc ? '<div class="s notes">' + esc(t.desc) + '</div>' : '') + '</div>';
  }).join('') : '<div class="s">Няма задачи</div>';
  h += fold('hist', '🕑 История (' + c.tasks.length + ')', pl.length ? pl.length + (pl.length === 1 ? ' планирана' : ' планирани') : '', hist);
  // 📝 Бележки
  h += fold('notes', '📝 Бележки', esc((c.notes || '').split(NL)[0]),
    '<div class="notes">' + (c.notes ? esc(c.notes) : '<span class="s">Няма бележки</span>') + '</div><div class="acts"><button onclick="editC()">✏️ Редактирай</button></div>');
  // 📸 Снимки
  var ph = c.photoErr ? '<div class="s">' + esc(c.photoErr) + '</div>' : c.photos.length ? '<div class="ph">' + c.photos.map(function(p){
    return '<a data-id="' + esc(p.id) + '" onclick="viewPhoto(this.dataset.id)">' + (p.thumb ? '<img src="' + p.thumb + '" alt="">' : '📷') + '</a>'; }).join('') + '</div>' +
    (c.folder ? '<div class="acts"><a href="' + esc(c.folder) + '" target="_blank">📁 Отвори папката</a></div>' : '') : '<div class="s">Няма снимки. Натисни 📸 Снимка горе.</div>';
  h += fold('photos', '📸 Снимки (' + c.photos.length + ')', '', ph);
  // 📎 Файлове
  var fl = c.files || [];
  var fh = c.photoErr ? '<div class="s">' + esc(c.photoErr) + '</div>' : (fl.length ? fl.map(function(f){
    return '<div class="fl"><a class="fn" href="' + esc(f.url) + '" target="_blank" rel="noopener"><span class="fi">' + fIcon(f) + '</span><span class="fx"><b>' + esc(f.name) + '</b><small>' +
      [fSize(f.size), f.t ? fmt(dayOf(f.t)) : ''].filter(Boolean).join(' · ') + '</small></span></a>' +
      '<button data-id="' + esc(f.id) + '" onclick="dlF(this.dataset.id)" title="Свали">⬇️</button>' +
      '<button data-id="' + esc(f.id) + '" data-n="' + esc(f.name) + '" onclick="delF(this.dataset.id,this.dataset.n)" title="Изтрий">🗑️</button></div>';
  }).join('') + '<div class="s" style="margin-top:6px">Докосни файла → отваря се в Google Drive · ⬇️ → сваля се в телефона</div>'
    : '<div class="s">Няма файлове. PDF, оферта, чертеж, договор… – до 25 MB.</div>') +
    '<div class="acts"><label>📎 Добави файл<input type="file" multiple style="display:none" onchange="upF(this)"></label>' +
    (c.folder ? '<a href="' + esc(c.folder) + '" target="_blank">📁 Отвори папката</a>' : '') + '</div>';
  h += fold('files', '📎 Файлове (' + fl.length + ')', '', fh);
  el('cdB').innerHTML = h;
}
function dayOf(t){ var d = new Date(t); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function fSize(b){ b = Number(b) || 0; return b >= 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : b ? Math.max(1, Math.round(b / 1024)) + ' KB' : ''; }
function fIcon(f){
  var n = String(f.name || '').toLowerCase(), m = String(f.mime || '');
  if (/pdf/.test(m) || /\.pdf$/.test(n)) return '📄';
  if (/sheet|excel|csv/.test(m) || /\.(xlsx?|csv|ods)$/.test(n)) return '📊';
  if (/presentation|powerpoint/.test(m) || /\.(pptx?|odp|key)$/.test(n)) return '📽️';
  if (/word|document|text\//.test(m) || /\.(docx?|odt|txt|rtf|pages)$/.test(n)) return '📝';
  if (/zip|rar|7z|compressed/.test(m) || /\.(zip|rar|7z)$/.test(n)) return '🗜️';
  if (/\.(dwg|dxf|skp|ifc|rvt|3dm|step|stp)$/.test(n)) return '📐';
  if (/^video\//.test(m)) return '🎬';
  if (/^audio\//.test(m)) return '🎧';
  return '📎';
}
var MAXMB = 25;
function upF(inp){
  var fs = Array.prototype.slice.call(inp.files || []), n = CUR.name, i = 0, nf = 0, np = 0; inp.value = '';
  var big = fs.filter(function(f){ return f.size > MAXMB * 1048576; });
  fs = fs.filter(function(f){ return f.size <= MAXMB * 1048576; });
  if (big.length) toast('⚠️ Над ' + MAXMB + ' MB – качи го направо в папката в Drive: ' + big.map(function(f){ return f.name; }).join(', '), 7000);
  if (!fs.length) return;
  cardBusy(true);
  var fail = function(e){ cardBusy(false); err(e); };
  var nextF = function(){
    if (i >= fs.length) {
      OPEN.files = true; if (np) OPEN.photos = true;
      try { localStorage.setItem('crm_open', JSON.stringify(OPEN)); } catch (e) {}
      google.script.run.withSuccessHandler(function(c){ CUR = c; cardBusy(false); drawCard(); toast('📎 Качени: ' + (nf + np) + (np ? ' (снимки: ' + np + ')' : '')); }).withFailureHandler(fail).getClient(n);
      return;
    }
    var f = fs[i], ok = function(){ i++; nextF(); };
    toast('📎 Качване ' + (fs.length > 1 ? (i + 1) + ' / ' + fs.length + ': ' : '') + f.name + (f.size > 2097152 ? ' (' + fSize(f.size) + ')' : '') + '…', 180000);
    if (/^image\/(jpeg|png|webp|gif)$/.test(f.type)) {
      np++; shrink2(f, function(data, thumb){ google.script.run.withSuccessHandler(ok).withFailureHandler(fail).uploadPhoto(n, data, f.name, thumb); });
    } else {
      nf++; var rd = new FileReader();
      rd.onload = function(){ google.script.run.withSuccessHandler(ok).withFailureHandler(fail).uploadFile(n, rd.result, f.name); };
      rd.onerror = function(){ fail(new Error('Файлът не може да се прочете')); };
      rd.readAsDataURL(f);
    }
  };
  nextF();
}
function dlF(id){
  toast('⬇️ Сваляне…', 120000);
  google.script.run.withSuccessHandler(function(r){
    if (!r.data) { toast('Отварям в Google Drive…'); window.open(r.url, '_blank'); return; }
    var m = r.data.match(/^data:([^;,]*)[^,]*;base64,([\s\S]*)$/), b = atob(m[2]), u8 = new Uint8Array(b.length);
    for (var k = 0; k < b.length; k++) u8[k] = b.charCodeAt(k);
    var url = URL.createObjectURL(new Blob([u8], { type: m[1] || r.mime })), a = document.createElement('a');
    a.href = url; a.download = r.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    toast('✅ ' + r.name);
  }).withFailureHandler(err).getFile(id);
}
function delF(id, name){
  if (!confirm('Да изтрия ли „' + name + '“?\nОтива в кошчето на Google Drive (може да се върне до 30 дни).')) return;
  cardBusy(true);
  google.script.run.withSuccessHandler(function(c){ CUR = c; cardBusy(false); drawCard(); toast('🗑️ Изтрит: ' + name); }).withFailureHandler(cardErr).trashFile(id, CUR.name);
}
function cardBusy(on){ el('cdB').style.opacity = on ? .45 : 1; el('cdB').style.pointerEvents = on ? 'none' : 'auto'; }
function cardErr(e){ cardBusy(false); err(e); }
function stageC(s){
  if (!CUR || s === CUR.stage) return; cardBusy(true);
  google.script.run.withSuccessHandler(function(c){ CUR = c; cardBusy(false); drawCard(); toast('Етап: ' + s); load(); }).withFailureHandler(cardErr).setStage(CUR.name, s);
}
function editC(){
  var c = CUR, h = '<form id="frm" onsubmit="return sendEdit(event)">';
  h += half(fld('Телефон', '<input name="phone" type="tel" value="' + esc(c.phone) + '">'), fld('Град', '<input name="city" value="' + esc(c.city) + '">'));
  h += half(fld('Модел', '<select name="model">' + opts(blank(D.models.indexOf(c.model) < 0 && c.model ? D.models.concat([c.model]) : D.models), c.model) + '</select>'),
    fld('Бюджет (€)', '<input name="budget" inputmode="numeric" value="' + esc(c.budget) + '">'));
  h += half(fld('Източник', '<select name="src">' + opts(blank(D.sources.indexOf(c.src) < 0 && c.src ? D.sources.concat([c.src]) : D.sources), c.src) + '</select>'),
    fld('Отговорник', '<select name="rep">' + opts(blank(D.reps), c.rep) + '</select>'));
  h += fld('Бележки', '<textarea name="notes" rows="6">' + esc(c.notes) + '</textarea>');
  h += '<button class="save" id="sv">💾 Запази</button></form>';
  openSheet('✏️ ' + c.name, h);
}
function sendEdit(e){
  e.preventDefault();
  var d = formData(), sv = el('sv'); sv.disabled = true; sv.textContent = 'Записване…';
  google.script.run.withSuccessHandler(function(c){ CUR = c; closeSheet(); drawCard(); toast('✅ Записано'); load(); })
    .withFailureHandler(function(er){ sv.disabled = false; sv.textContent = '💾 Запази'; err(er); }).updateClient(CUR.name, d);
  return false;
}
function locC(){
  if (!navigator.geolocation) { toast('Телефонът не дава местоположение'); return; }
  toast('📍 Търся местоположението…', 10000); cardBusy(true);
  navigator.geolocation.getCurrentPosition(function(p){
    google.script.run.withSuccessHandler(function(c){ CUR = c; cardBusy(false); drawCard(); toast('📍 Локацията е записана в бележките'); })
      .withFailureHandler(cardErr).saveLocation(CUR.name, p.coords.latitude, p.coords.longitude);
  }, function(e){ cardBusy(false); toast('Няма достъп до местоположението – разреши го в браузъра', 4500); }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });
}
function viewPhoto(id){
  el('pvI').removeAttribute('src'); el('pvL').textContent = 'Зареждане…'; el('pvL').style.display = 'block'; el('pv').style.display = 'flex';
  google.script.run.withSuccessHandler(function(u){ el('pvL').style.display = 'none'; el('pvI').src = u; })
    .withFailureHandler(function(e){ el('pvL').textContent = 'Грешка: ' + e.message; }).getPhoto(id);
}
function closePv(){ el('pv').style.display = 'none'; el('pvI').removeAttribute('src'); }
function shrinkTo(img, m, q){
  var w = img.width, h = img.height, k = Math.min(1, m / Math.max(w, h));
  var cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', q);
}
function shrink2(file, cb){
  var rd = new FileReader();
  rd.onload = function(){
    var img = new Image();
    img.onload = function(){ cb(shrinkTo(img, 1600, 0.82), shrinkTo(img, 360, 0.7)); };
    img.onerror = function(){ cb(rd.result, ''); };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}
function shrink(file, cb){
  var rd = new FileReader();
  rd.onload = function(){
    var img = new Image();
    img.onload = function(){
      var m = 1600, w = img.width, h = img.height, k = Math.min(1, m / Math.max(w, h));
      var cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function(){ cb(rd.result); };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}
function upC(inp){
  var fs = Array.prototype.slice.call(inp.files || []), n = CUR.name, i = 0; inp.value = '';
  if (!fs.length) return; cardBusy(true);
  var nextF = function(){
    if (i >= fs.length) {
      google.script.run.withSuccessHandler(function(c){ CUR = c; cardBusy(false); drawCard(); toast('📸 Качени: ' + fs.length); }).withFailureHandler(cardErr).getClient(n);
      return;
    }
    toast('📸 Качване ' + (i + 1) + ' / ' + fs.length + '…', 60000);
    shrink2(fs[i], function(data, thumb){
      google.script.run.withSuccessHandler(function(){ i++; nextF(); }).withFailureHandler(cardErr).uploadPhoto(n, data, fs[i].name, thumb);
    });
  };
  nextF();
}

document.addEventListener('visibilitychange', function(){ if (!document.hidden && D && TOKEN && el('sheet').style.display !== 'block') load(); });
// Нова версия → проверява се при всяко отваряне/връщане в приложението и се зарежда сама
var APP_VER = '3.7';
if ('serviceWorker' in navigator) {
  var swHad = !!navigator.serviceWorker.controller, swDone = false;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function(r){
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) r.update().catch(function(){}); });
    setInterval(function(){ r.update().catch(function(){}); }, 1800000);
  }).catch(function(){});
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (!swHad) { swHad = true; return; }
    if (swDone) return; swDone = true;
    if (el('sheet').style.display === 'block') { toast('🔄 Има нова версия – зарежда се при следващото отваряне', 5000); return; }
    toast('🔄 Нова версия…', 3000); setTimeout(function(){ location.reload(); }, 400);
  });
}
boot();
